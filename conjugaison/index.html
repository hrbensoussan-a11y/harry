<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0A18" />
  <title>Conjugo — Maîtrise tes conjugaisons</title>
  <meta name="description" content="Apprends et maîtrise 5 temps du français : imparfait, passé simple, conditionnel présent, conditionnel passé et plus-que-parfait. Leçons courtes, défis immédiats, progression." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✍️%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="Accueil">
        <span class="brand-mark" aria-hidden="true">Cj</span>
        <span class="brand-name">Conjugo</span>
      </button>

      <nav class="nav" aria-label="Navigation principale">
        <button data-go="home">Accueil</button>
        <button data-go="lessons">Leçons</button>
        <button data-go="train">Entraînement</button>
        <button data-go="progress">Progression</button>
      </nav>

      <div class="hud">
        <span class="chip xp" id="hudXp" title="Expérience"><span class="chip-ico">⚡</span><span id="hudXpVal">0</span></span>
        <span class="chip fire" id="hudStreak" title="Série de bonnes réponses"><span class="chip-ico">🔥</span><span id="hudStreakVal">0</span></span>
        <button class="icon-btn" id="soundBtn" aria-label="Activer ou couper le son">🔊</button>
      </div>
    </header>

    <main>
      <section class="view" id="view-home" aria-label="Accueil"></section>
      <section class="view" id="view-lessons" aria-label="Leçons"></section>
      <section class="view" id="view-lesson" aria-label="Leçon en cours"></section>
      <section class="view" id="view-train" aria-label="Entraînement"></section>
      <section class="view" id="view-progress" aria-label="Progression"></section>
    </main>

    <footer>
      Conjugo — 5 temps, rien de plus. Ta progression est enregistrée dans ce navigateur.
      <br /><button id="resetBtn">Effacer ma progression</button>
    </footer>
  </div>

  <canvas id="confetti" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:50;display:none"></canvas>

  <script src="js/verbs.js"></script>
  <script src="js/conjugate.js"></script>
  <script src="js/content.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
